<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signup | Air India</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><div class="auth"><div class="auth-card"><h1>🇮🇳 AIR INDIA</h1><p>Create your monitoring account</p><h2>Sign Up</h2>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="post"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password (6+ characters)" required><button type="submit">Create Account</button></form><p>Already registered? <a href="/login">Login</a></p></div></div><style>.auth{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#e8f7ff,#f6fff8)}.auth-card{width:min(420px,92%);background:#fff;padding:32px;border-radius:20px;box-shadow:0 10px 35px #0002;text-align:center}.auth-card h1{color:#0069a6}.auth-card h2{margin:25px 0 15px}.auth-card input,.auth-card button{width:100%;padding:13px;margin:7px 0;border-radius:9px;border:1px solid #ccd6df}.auth-card button{background:#0077b6;color:#fff;border:0;font-weight:700}.auth-card a{color:#0077b6}.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px}</style></body></html>
